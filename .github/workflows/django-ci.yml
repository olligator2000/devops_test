name: Django CI Pipeline

# Триггеры: когда запускать
on:
  push:
    branches: [ develop, main ]
  pull_request:
    branches: [ develop, main ]

# Что будем делать
jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      max-parallel: 4
      matrix:
        python-version: [3.10, 3.11, 3.12, 3.13]

    steps:
    # 1. Скачиваем код из репозитория
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    # 2. Устанавливаем Python
    - name: 🐍 Setup Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    # 3. Устанавливаем зависимости
    - name: 📦 Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # 4. Проверяем синтаксис (linting)
    - name: 🔍 Run flake8 (code style check)
      run: |
        pip install flake8
        flake8 gallery/ --count --show-source --statistics

    # 5. Проверяем, что Django настроен правильно
    - name: ✅ Run Django system checks
      run: |
        python manage.py check

    # 6. Запускаем тесты (если есть)
    - name: 🧪 Run tests
      run: |
        python manage.py test

    # 7. Проверяем, что собираются статические файлы
    - name: 📁 Collect static files
      run: |
        python manage.py collectstatic --noinput

    # 8. Сохраняем артефакты (если тесты упали - логи пригодятся)
    - name: 📤 Upload test logs
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: test-logs-${{ matrix.python-version }}
        path: |
          *.log
          .pytest_cache/